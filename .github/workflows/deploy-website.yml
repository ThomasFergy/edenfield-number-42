name: Deploy website

# Publishes both design options to GitHub Pages:
#   /            chooser page
#   /classic/    first design (built from the `design-classic` tag)
#   /refined/    current design (built from main)

on:
  push:
    branches: [main]
    paths: ['website/**', 'scripts/build-pages.sh', '.github/workflows/deploy-website.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history and tags to build the classic design
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: scripts/build-pages.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
