name: CI

# Checks only; nothing is deployed from here.
on:
  push:
    branches: [main]
    paths: ['website/**']
  pull_request:
    paths: ['website/**']

jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
